<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ListOfPosts - Francesco Morrone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1 class="logo">ListOfPosts</h1>
            <nav>
                <button class="nav-link active" data-section="this-month">Current</button>
                <button class="nav-link" data-section="archive">Archive</button>
                <button class="nav-link" data-section="about">About</button>
            </nav>
        </header>

        <main>
            <section id="this-month" class="section active">
                <h2 id="current-month-title">Caricamento...</h2>
                <div id="current-resources" class="resources-grid"></div>
            </section>

            <section id="archive" class="section">
                <h2>Archive</h2>
                <div id="archive-list" class="archive-list"></div>
            </section>

            <section id="about" class="section">
                <div class="about-card">
                    <h2>About</h2>
                    <p>
                        ...
                    </p>
                    <p class="about-meta">
                        
                    </p>
                </div>
            </section>
        </main>

        <footer>
            <p>©2026 - ListOfPosts - Francesco Morrone</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
